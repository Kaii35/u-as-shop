<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="Insumos de belleza profesional: esmaltes, geles, herramientas y nail art. Envíos a toda Colombia." />

    <!-- El SVG lo prefieren los navegadores modernos y escala a cualquier
         tamaño; los PNG y el .ico cubren a los que no lo leen. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="alternate icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Natalia Sánchez · Insumos de belleza profesional</title>
    <!--
      Tema, aplicado ANTES de pintar.

      Va aqui en linea y sin `defer` a proposito: si esperara a que React
      montara, el navegador ya habria pintado una pagina blanca y se veria un
      destello cegador antes de pasar a oscuro. Es el fallo clasico del modo
      oscuro y la unica forma de evitarlo es esto.

      Duplica tres lineas de `src/lib/theme.ts`. Es una duplicacion aceptada:
      importar el modulo exigiria cargarlo antes del primer pintado, que es
      justo lo que no se puede hacer.
    -->
    <script>
      (function () {
        try {
          // Clave con el prefijo del nombre anterior; ver src/lib/theme.ts.
          var guardado = localStorage.getItem('aurelle.theme');
          var oscuro =
            guardado === 'dark' ||
            (guardado !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (oscuro) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#1A1012');
          }
        } catch (e) {
          /* Sin almacenamiento se queda en claro. Mejor eso que no arrancar. */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700&family=Inter:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
